<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contagem para Belo Horizonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #171B33;
    --sky-mid: #5B3E72;
    --sky-low: #A85B4E;
    --sky-horizon: #E8A33D;
    --mtn-near: #232A45;
    --cream: #FDF6E9;
    --cream-soft: #E7DCC4;
    --gold: #F2C572;
  }
  *{ box-sizing: border-box; }
  html{ width:100%; }
  body{
    margin:0;
    width:100%;
    font-family: 'Manrope', sans-serif;
    overflow-x:hidden;
    background: linear-gradient(180deg,
      var(--sky-top) 0%,
      var(--sky-mid) 46%,
      var(--sky-low) 78%,
      var(--sky-horizon) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* Stars */
  .stars{
    position:absolute;
    top:0; left:0; right:0;
    height: 340px;
    max-height: 40vh;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .star{
    position:absolute;
    width:2px; height:2px;
    background: var(--cream);
    border-radius:50%;
    opacity:0.55;
    animation: twinkle 4.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0.2; }
    50%{ opacity:0.85; }
  }

  .scene{
    position:relative;
    z-index:4;
    width:100%;
    max-width: 900px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hero{
    position:relative;
    z-index:5;
    width:100%;
    padding: clamp(34px, 8vh, 76px) 20px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    animation: fadeUp 1s ease-out 0.2s forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .kicker{
    font-family:'Newsreader', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(15px, 3.4vw, 19px);
    color: var(--cream-soft);
    letter-spacing: 0.01em;
    margin: 0 0 6px;
  }

  .destination{
    font-family:'Newsreader', serif;
    font-weight: 600;
    font-size: clamp(27px, 6.5vw, 46px);
    color: var(--cream);
    margin: 0;
    line-height: 1.15;
    padding: 0 6px;
  }

  /* Timer row */
  .discwrap{
    position:relative;
    z-index:4;
    margin-top: clamp(20px, 4vh, 44px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8px 16px 4px;
    opacity:0;
    transform: translateY(22px);
    animation: rise 1.1s cubic-bezier(.2,.7,.25,1) 0.5s forwards;
    width:100%;
  }
  @keyframes rise{
    to{ opacity:1; transform: translateY(0); }
  }
  .glow{
    position:absolute;
    width: clamp(280px, 82vw, 640px);
    height: clamp(150px, 34vw, 300px);
    border-radius:50%;
    background: radial-gradient(ellipse, rgba(242,197,114,0.5) 0%, rgba(242,197,114,0.14) 45%, rgba(242,197,114,0) 72%);
    filter: blur(2px);
    z-index:0;
  }
  .timerow{
    position:relative;
    z-index:1;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap: clamp(10px, 3.6vw, 30px);
    row-gap: 14px;
  }
  .tunit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width: 58px;
  }
  .tnum{
    font-family:'Newsreader', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(34px, 8.6vw, 66px);
    line-height: 1;
    color: var(--cream);
    text-shadow: 0 0 28px rgba(242,197,114,0.45);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tlabel{
    font-size: clamp(10.5px, 2.1vw, 12.5px);
    color: var(--cream-soft);
    margin-top: 4px;
    letter-spacing: 0.03em;
  }

  .arrived{
    display:inline-block;
    margin-top: 16px;
    padding: 7px 18px;
    border-radius: 999px;
    background: var(--gold);
    color: var(--mtn-near);
    font-size: 13.5px;
    font-weight: 700;
  }

  .mountains{
    position:relative;
    z-index:3;
    width:100%;
    margin-top: clamp(20px, 5vh, 44px);
    line-height:0;
  }
  .mountains svg{ display:block; width:100%; height:auto; }

  .companions{
    position:relative;
    z-index:6;
    width:100%;
    background: var(--mtn-near);
    display:flex;
    justify-content:center;
  }
  .companions-inner{
    width:100%;
    max-width: 900px;
    padding: clamp(18px, 4vh, 30px) 20px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .companions-label{
    font-family:'Newsreader', serif;
    font-style: italic;
    font-size: clamp(14px, 2.6vw, 17px);
    color: var(--cream-soft);
    margin: 0 0 16px;
    text-align:center;
  }
  .polaroids{
    display:flex;
    flex-wrap: wrap;
    justify-content:center;
    align-items:flex-start;
    gap: clamp(14px, 4vw, 30px);
    width:100%;
  }
  .polaroid{
    background: var(--cream);
    padding: 8px 8px 16px;
    border-radius: 3px;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,0.5);
    width: clamp(108px, 30vw, 168px);
  }
  .polaroid:nth-child(1){ transform: rotate(-4deg); }
  .polaroid:nth-child(2){ transform: rotate(3deg); }
  .polaroid img{
    display:block;
    width:100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 1px;
  }

  .datestrip{
    position:relative;
    z-index:6;
    width:100%;
    text-align:center;
    padding: 20px 20px 12px;
    background: var(--mtn-near);
  }
  .datestrip .date{
    font-family:'Newsreader', serif;
    font-style: italic;
    font-size: clamp(14.5px, 3.2vw, 18px);
    color: var(--cream);
    margin:0 0 4px;
  }
  .datestrip .breakdown{
    font-size: 12.5px;
    color: var(--cream-soft);
    margin:0;
  }

  .footer{
    position:relative;
    z-index:6;
    width:100%;
    background: var(--mtn-near);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 6px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .linkbtn{
    font-family:'Manrope', sans-serif;
    font-size: 13px;
    font-weight:700;
    color: var(--mtn-near);
    background: var(--cream);
    border: none;
    padding: 11px 22px;
    border-radius: 999px;
    cursor:pointer;
    transition: transform 0.15s, background 0.15s;
    max-width: 100%;
  }
  .linkbtn:hover{ background: var(--gold); transform: translateY(-1px); }

  @media (max-width: 360px){
    .destination{ font-size: clamp(24px, 7.4vw, 30px); }
    .tnum{ font-size: clamp(28px, 8.6vw, 40px); }
  }

  @media (min-width: 1400px){
    .tnum{ font-size: 70px; }
  }

  @media (prefers-reduced-motion: reduce){
    .hero, .discwrap, .star{ animation: none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

  <div class="datestrip">
    <p class="date" id="dateLine">06 de fevereiro de 2027</p>
    <p class="breakdown" id="breakdown"></p>
  </div>

  <div class="footer">
    <button class="linkbtn" id="copyLink">Copiar link para enviar aos amigos</button>
  </div>

<script>
(function(){
  // Scatter stars
  const starsEl = document.getElementById('stars');
  const n = 40;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*4.5) + 's';
    const size = Math.random() < 0.15 ? 3 : 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    starsEl.appendChild(s);
  }

  // Target: meia-noite do dia 06/02/2027
  const TARGET = new Date(2027, 1, 6, 0, 0, 0);

  const dEl = document.getElementById('d');
  const hEl = document.getElementById('h');
  const mEl = document.getElementById('m');
  const sEl = document.getElementById('s');
  const dLabelEl = document.getElementById('dLabel');
  const arrivedWrap = document.getElementById('arrivedWrap');
  const breakdownEl = document.getElementById('breakdown');
  const dateLine = document.getElementById('dateLine');

  dateLine.textContent = TARGET.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  function pad(n){ return String(n).padStart(2, '0'); }

  let stopped = false;

  function tick(){
    if (stopped) return;
    const now = new Date();
    const diffMs = TARGET - now;

    if (diffMs <= 0){
      dEl.textContent = '0';
      hEl.textContent = '00';
      mEl.textContent = '00';
      sEl.textContent = '00';
      arrivedWrap.innerHTML = '<span class="arrived">é hoje — boa viagem! 🎉</span>';
      breakdownEl.textContent = '';
      stopped = true;
      return;
    }

    const days = Math.floor(diffMs / 86400000);
    const hours = Math.floor((diffMs % 86400000) / 3600000);
    const minutes = Math.floor((diffMs % 3600000) / 60000);
    const seconds = Math.floor((diffMs % 60000) / 1000);

    dEl.textContent = days;
    dLabelEl.textContent = days === 1 ? 'dia' : 'dias';
    hEl.textContent = pad(hours);
    mEl.textContent = pad(minutes);
    sEl.textContent = pad(seconds);

    const months = Math.floor(days / 30);
    const weeks = Math.floor((days % 30) / 7);
    let parts = [];
    if (months > 0) parts.push(months + (months === 1 ? ' mês' : ' meses'));
    if (weeks > 0) parts.push(weeks + (weeks === 1 ? ' semana' : ' semanas'));
    breakdownEl.textContent = parts.length ? ('aproximadamente ' + parts.join(' e ')) : '';
  }

  tick();
  setInterval(tick, 1000);

  document.getElementById('copyLink').addEventListener('click', async () => {
    const btn = document.getElementById('copyLink');
    try{
      await navigator.clipboard.writeText(window.location.href);
      const original = btn.textContent;
      btn.textContent = 'Link copiado ✓';
      setTimeout(() => { btn.textContent = original; }, 1700);
    } catch(e){}
  });
})();
</script>
